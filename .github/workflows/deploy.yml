name: Deploy to GitHub Pages

# Builds the SvelteKit app (adapter-static) and publishes it at the domain root.
# `static/CNAME` carries the custom domain into the artifact; `.nojekyll` stops
# Pages from swallowing the `_app/` directory.
#
# One-time setup: in repo Settings > Pages, set "Build and deployment" >
# "Source" to "GitHub Actions" (instead of "Deploy from a branch").

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Serve the artifact as-is (no Jekyll processing of _app/ etc.)
        run: touch build/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
